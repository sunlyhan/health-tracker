<title>健康管理台</title>
<style>
  /* ============================================================
     THEME TOKENS — 一处改色，整站换肤（简约·墨色中性默认）
     ============================================================ */
  :root {
    /* ---- 页面与表面 ---- */
    --page-bg: #f5f0e8;              /* 页面底色：暖奶油色，和人像背景同色系 */
    --surface-card: #fdfaf5;         /* 卡片：比底色更亮的暖白 */
    --surface-nested: #f2ede3;       /* 嵌套区域：暖米色 */

    /* ---- 边框 ---- */
    --border: #e8e1d4;               /* 常规边框：暖灰米 */
    --border-input: #ddd5c7;         /* 强边框：暖灰 */

    /* ---- 文本层级 ---- */
    --text: #2c2416;                 /* 主文本：暖深棕（头发色） */
    --text-secondary: #8c7b6b;       /* 次文本：暖灰棕 */
    --text-tertiary: #a89886;        /* 弱文本：浅暖灰 */

    /* ---- 主色（按钮/选中/强调） ---- */
    --accent: #3a2e22;               /* 主色：暖深棕 */
    --accent-muted: #efe7d9;         /* 主色浅底：暖米 */
    --on-accent: #f5f0e8;            /* 主色上的前景文字 */

    /* ---- 模块色（5 色轮转，暖色系协调） ---- */
    --module-1: #7a9268;             /* 橄榄绿 — 饮食/打卡 */
    --module-2: #b08850;             /* 暖金 — 体重/趋势 */
    --module-3: #c4855a;             /* 暖陶 — 运动/连续天数 */
    --module-4: #9a6b5a;             /* 赤陶 — 作息 */
    --module-5: #7d6b8a;             /* 暖紫 — 日记/指导 */

    /* ---- 危险色 ---- */
    --danger: #b85a4a;               /* 删除/危险操作 */
    --danger-muted: #f4e8e2;         /* 危险浅底 */

    /* ---- 抽屉（深色面板，暖棕系） ---- */
    --drawer-bg: #2c2416;            /* 抽屉底色：暖深棕 */
    --drawer-bg-top: #3a2e22;        /* 抽屉渐变上色 */
    --drawer-text: #f5f0e8;          /* 抽屉前景文字 */
    --drawer-text-mute: rgba(245,240,232,.55);  /* 抽屉次要文字/图标 */
    --drawer-hover: rgba(245,240,232,.1);       /* 抽屉悬停底 */

    --page-texture: none;                            /* 页面纹理叠加（none 或 url(...)），不影响内容层 */

    /* ---- 圆角（按组件角色，不要裸写数字） ---- */
    --radius-control: 8px;           /* 勾选框、步进按钮、日历格 */
    --radius-tile: 12px;             /* 图标瓦、输入框、按钮、chip、cal-nav */
    --radius-card: 16px;             /* 卡片、面板、hero、空态图标 */
    --radius-sheet: 22px;            /* 底部弹窗顶部圆角 */

    /* ---- 阴影 ---- */
    --shadow-card: 0 1px 2px rgba(44,36,22,.04), 0 4px 16px rgba(44,36,22,.06);   /* 卡片/面板 */
    --shadow-overlay: 0 10px 28px rgba(44,36,22,.14);                             /* 弹窗/toast/悬浮按钮 */

    /* ---- 字体与布局 ---- */
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --nav-h: 62px;                   /* 底部导航栏高度 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--module-2); outline-offset: 2px; border-radius: 4px; }
  button { -webkit-focus-ring-color: var(--module-2); }
  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto; position: relative;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }
  .app { padding: 0 16px calc(var(--nav-h) + 26px); }
  svg { display: block; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 2px 8px; backdrop-filter: blur(10px);
    background: linear-gradient(180deg, color-mix(in srgb, var(--page-bg) 94%, transparent), color-mix(in srgb, var(--page-bg) 50%, transparent)); }
  .topbar .menu-btn { width: 38px; height: 38px; border: none; border-radius: var(--radius-tile); background: var(--surface-card);
    box-shadow: var(--shadow-card); display: grid; place-items: center; cursor: pointer; color: var(--text); }
  .topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; flex: 1; line-height: 1.2; }
  .topbar .title small { display:block; font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing:.02em; margin-top: 2px; }
  .date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- generic card / section ---------- */
  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size: 13px; font-weight: 700; margin: 14px 2px 8px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .sec-title .more { margin-left:auto; font-size: 12px; color: var(--text-secondary); font-weight: 500; cursor: pointer; display:inline-flex; align-items:center; gap:2px; }
  .sec-title .more svg { color: var(--text-tertiary); }

  /* ---------- greeting ---------- */
  .greet { position: relative; overflow: hidden; margin-top: 6px; padding: 16px 18px 18px; border-radius: var(--radius-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-card); min-height: 130px;
    background: var(--surface-nested) var(--greet-image) right center / auto 100% no-repeat; }
  .greet::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(95deg, var(--surface-nested) 30%, color-mix(in srgb, var(--surface-nested) 50%, transparent) 50%, transparent 72%); }
  .greet::after { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--surface-nested) 40%, transparent) 100%); }
  .greet > * { position: relative; z-index: 1; }
  .greet h1 { font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
  .greet p { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }

  /* ---------- quote card ---------- */

    letter-spacing: .04em; margin-bottom: 6px; }

  /* ---------- overview rings ---------- */

    border-radius: var(--radius-tile); background: var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card);

    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size: 11px; font-weight: 600; color: var(--text); }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:flex; flex-direction:column; gap: 6px; }

    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 13px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }

  .pin .arw { color: var(--text-tertiary); flex:0 0 auto; }

  /* ---------- record list (inside a module) ---------- */
  .rec { position: relative; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);

    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition: all .15s; margin-top: 1px; }

  .rec .rnote { color: var(--text-secondary); font-size: 12.5px; margin-top: 7px; white-space: pre-wrap; line-height: 1.55; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge .dot { width:6px;height:6px;border-radius:50%;background:currentColor; }

  /* module header (finance summary) */

  .mini { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile); box-shadow: var(--shadow-card); padding: 12px; }
  .mini .l { font-size: 11px; color: var(--text-secondary); }

  /* module hero header (per-type summary) — compact strip */

    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position:relative; overflow:hidden; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */

  .rec.rec-layout-quote .quote-meta { margin-top:8px; font-size:12px; color:var(--text-tertiary); }

  /* ---------- bottom nav ---------- */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; height: var(--nav-h);
    background: rgba(252,251,248,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--border);

  .nav .n.active { color: var(--accent); font-weight: 700; }

  /* ---------- drawer ---------- */

    transition: transform .26s cubic-bezier(.2,.8,.25,1); overflow-y:auto;
    background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color:var(--drawer-text); }
  .drawer.show { transform: translateX(0); }
  .drawer .dh { padding: 26px 22px 18px; display:flex; align-items:center; gap: 12px; position: relative; }
  .drawer .dh .brand { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--drawer-active); cursor: pointer; }

  .drawer .dh .brand .brand-cam { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
    background: color-mix(in srgb, var(--text) 50%, transparent); color:var(--drawer-text); transition: opacity .15s; }
  .drawer .dh .brand:active .brand-cam { opacity:1; }
  .drawer .dh h2 { font-size: 17px; font-weight: 800; }
  .drawer .dh p { font-size: 11px; opacity: .55; margin-top: 3px; letter-spacing: .05em; }
  .drawer .dclose { position:absolute; top:18px; right:16px; width:32px;height:32px;border-radius:var(--radius-tile); border:none; cursor:pointer;
    background: var(--drawer-hover); color:var(--drawer-text); display:grid; place-items:center; }
  .drawer .dsep { height:1px; background: var(--drawer-active); margin: 6px 22px 8px; }
  .drawer .ditem { display:flex; align-items:center; gap: 13px; padding: 12px 22px; cursor:pointer; font-size: 15px; font-weight: 500; color: color-mix(in srgb, var(--drawer-text) 82%, transparent); }
  .drawer .ditem svg { color: var(--drawer-text-mute); }

  .drawer .ditem.active svg { color:var(--drawer-text); }
  .drawer .dfoot { font-size: 11px; opacity:.45; padding: 20px 22px 28px; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--text) 44%, transparent); backdrop-filter: blur(3px); z-index: 60;
    display:flex; align-items:flex-end; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background: var(--surface-card); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px; box-shadow: 0 -20px 50px color-mix(in srgb, var(--text) 24%, transparent); animation: up .24s cubic-bezier(.2,.8,.25,1); max-height: 88vh; overflow-y:auto; }

  .field { margin-bottom: 13px; }

    padding: 11px 12px; background: var(--surface-card); color: var(--text); outline:none; width: 100%; transition: border-color .15s, box-shadow .15s; }

  .btn.danger { background: var(--danger); }

  /* ---------- insight charts ---------- */
  .bar-list { display:flex; flex-direction:column; gap:11px; margin-top:14px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-ic { width:30px; height:30px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }

  /* ---------- calendar grid ---------- */
  .cal-panel { margin-top:12px; }
  .cal-hd { display:flex; align-items:center; gap:10px; }
  .cal-nav { width:30px; height:30px; border-radius:var(--radius-tile); border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text); cursor:pointer; display:grid; place-items:center; transition: all .15s; }
  .cal-nav:active { background:var(--accent-muted); border-color:var(--accent); }
  .cal-nav[data-cal="prev"] svg { transform: scaleX(-1); }
  .cal-title { flex:1; text-align:center; font-size:14px; font-weight:700; color:var(--text); }

  .cal-chips::-webkit-scrollbar { display:none; }
  .cal-chip { flex:0 0 auto; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary); cursor:pointer; white-space:nowrap; transition: all .15s;
    font-family:var(--font); }
  .cal-chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .cal-dow { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--text-tertiary); font-weight:600; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell { aspect-ratio:1; border-radius:var(--radius-control); display:grid; place-items:center; font-size:12px; font-weight:600;
    color:var(--text-secondary); background:var(--surface-nested); border:1px solid var(--border); cursor:pointer; transition: all .15s;
    font-family:var(--font); }
  .cal-cell.blank { background:transparent; border:none; cursor:default; }
  .cal-cell.on { color:#fff; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell:active { transform: scale(.92); }
  .cal-toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%) translateY(16px);
    background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px;

  .cal-toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

  /* ---------- smart plan ---------- */

  .plan-empty { text-align:center; padding:24px 16px; color:var(--text-tertiary); font-size:12px; }
  .plan-stat { display:flex; gap:8px; margin-top:8px; }

  .plan-stat .ps .ps-v { font-size:16px; font-weight:800; }

  /* ---------- exercise log ---------- */
  .exlog-panel { margin-top:10px; }
  .exlog-entry { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-tile);
    background:var(--surface-nested); border:1px solid var(--border); margin-bottom:6px; }
  .exlog-entry .el-icon { width:32px; height:32px; border-radius:8px; background:var(--module-3); color:#fff;
    display:grid; place-items:center; flex:0 0 auto; font-size:14px; }
  .exlog-entry .el-info { flex:1; min-width:0; }
  .exlog-entry .el-type { font-size:13px; font-weight:600; color:var(--text); }
  .exlog-entry .el-meta { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .exlog-entry .el-del { flex:0 0 auto; width:28px; height:28px; border-radius:6px; border:none;
    background:transparent; color:var(--text-tertiary); cursor:pointer; display:grid; place-items:center; }
  .exlog-entry .el-del:active { background:var(--danger-light); color:var(--danger); }
  .exlog-rest { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-tile);
    background:color-mix(in srgb, var(--module-4) 12%, var(--surface-nested)); border:1px solid var(--border);
    margin-bottom:6px; }

  .exlog-add-bar { display:flex; gap:6px; margin-top:8px; }
  .exlog-add-bar input { flex:1; min-width:0; border:1px solid var(--border); border-radius:var(--radius-tile);
    padding:8px 10px; font-size:13px; background:var(--surface-card); color:var(--text); font-family:var(--font); }
  .exlog-add-bar input::placeholder { color:var(--text-tertiary); }
  .exlog-add-bar button { flex:0 0 auto; border:none; border-radius:var(--radius-tile); padding:8px 14px;
    font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font); }
  .exlog-rest-btn { width:100%; border:1px dashed var(--module-4); background:transparent; color:var(--module-4);

    background:var(--surface-nested); border:1px solid var(--border); }
  .exlog-stats .es .es-v { font-size:14px; font-weight:700; color:var(--module-3); }
  .exlog-stats .es .es-l { font-size:10px; color:var(--text-secondary); margin-top:1px; }
  .cal-foot { margin-top:12px; font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .cal-foot svg { color:var(--module-3); }

  .hidden { display: none !important; }

  /* ---------- photo rotation ---------- */
  .photo-manage-btn {
    margin: 0 16px 12px;
    padding: 8px 12px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-tile);
    background: var(--surface-nested);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;

  .photo-modal {

  .photo-modal .pm-sheet {

  .photo-modal .pm-item .pm-del {

  .photo-modal .pm-add {
    aspect-ratio: 1;
    border: 2px dashed var(--border);

  .photo-modal .pm-add:active { background: var(--surface-card); }
  .photo-modal .pm-hint {
    font-size: 12px; color: var(--text-secondary);
    text-align: center; padding: 8px;
    line-height: 1.5;

  /* ---------- weight chart (full history) ---------- */
  .wc-panel { margin-top: 12px; }
  .wc-head { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
  .wc-head svg { color: var(--text-tertiary); }
  .wc-head .wc-delta { margin-left:auto; font-size:12px; font-weight:600; }
  .wc-svg { width:100%; height:auto; margin-top:14px; display:block; }
  .wc-x { display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:6px; padding:0 4px; }
  .wc-stats { display:flex; justify-content:space-between; margin-top:14px; gap:8px; }
  .wc-stat { flex:1; text-align:center; background:var(--surface-nested); border:1px solid var(--border); border-radius:var(--radius-tile); padding:10px 6px; }
  .wc-stat .l { font-size:10px; color:var(--text-secondary); font-weight:600; }
  .wc-stat .v { font-size:16px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }
  .wc-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:120px;
    color:var(--text-tertiary); font-size:12px; margin-top:8px; }

  /* ---------- collapsible cards (guide module) ---------- */
  .rec.collapsible { padding: 0; overflow: hidden; }
  .rec.collapsible .col-header { display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; }
  .rec.collapsible .col-badge { flex:0 0 auto; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
    background:var(--accent-muted); color:var(--accent); white-space:nowrap; }
  .rec.collapsible .col-title { flex:1; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec.collapsible .col-chev { flex:0 0 auto; color:var(--text-tertiary); transition:transform .25s; }
  .rec.collapsible.expanded .col-chev { transform:rotate(90deg); }
  .rec.collapsible .col-body { max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .rec.collapsible.expanded .col-body { max-height:800px; }
  .rec.collapsible .col-body-inner { padding:0 14px 14px; }
  .rec.collapsible .col-body .rnote { margin-top:0; }
  .rec.collapsible .acts { top:10px; right:8px; }

  /* ---------- daily food suggestion (home) ---------- */
  .food-panel { margin-top: 8px; }
  .food-head { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
  .food-head svg { color: var(--text-tertiary); }
  .food-head .food-tip { margin-left:auto; font-size:10px; font-weight:500; color:var(--text-tertiary); }
  .food-meals { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .food-meal { display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:var(--radius-tile);
    background:var(--surface-nested); border:1px solid var(--border); }
  .food-meal .meal-label { flex:0 0 auto; font-size:11px; font-weight:700; color:var(--text-secondary);
    width:42px; text-align:center; padding-top:1px; }
  .food-meal .meal-label .meal-emoji { display:block; font-size:16px; margin-bottom:1px; }
  .food-meal .meal-items { flex:1; min-width:0; }
  .food-meal .meal-main { font-size:12.5px; font-weight:600; color:var(--text); line-height:1.45; }
  .food-meal .meal-sub { font-size:10.5px; color:var(--text-secondary); margin-top:3px; line-height:1.45; }
  .food-meal .meal-tag { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px;
    margin-right:4px; margin-top:5px; }

  /* ---------- voice quick record ---------- */
  .voice-fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px); z-index: 100;
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-overlay);
    display: flex; align-items: center; justify-content: center; transition: transform .15s, filter .15s;
    -webkit-tap-highlight-color: transparent; }
  .voice-fab:active { transform: scale(.92); filter: brightness(1.15); }
  .voice-fab.recording { background: var(--danger); animation: voicePulse 1.2s ease-in-out infinite; }
  @keyframes voicePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(184,90,74,.4); } 50% { box-shadow: 0 0 0 12px rgba(184,90,74,0); } }

  .voice-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(44,36,22,.5); backdrop-filter: blur(4px);
    display: flex; flex-direction: column; justify-content: flex-end; }
  .voice-sheet { background: var(--surface-card); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-overlay); }
  .voice-sheet h3 { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
  .voice-sheet .vsub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .voice-transcript { margin: 16px 0; padding: 14px 16px; background: var(--surface-nested); border-radius: var(--radius-tile);
    border: 1px solid var(--border); font-size: 14px; line-height: 1.6; min-height: 60px; color: var(--text);
    white-space: pre-wrap; word-break: break-all; }
  .voice-transcript.empty { color: var(--text-tertiary); font-style: italic; }
  .voice-results { margin-bottom: 16px; }
  .voice-result-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-tile);
    background: var(--surface-nested); border: 1px solid var(--border); margin-bottom: 8px; font-size: 13.5px; }
  .voice-result-item .vri-icon { flex:0 0 auto; width: 28px; height: 28px; border-radius: 50%; display:flex; align-items:center; justify-content:center; }
  .voice-result-item .vri-text { flex:1; min-width:0; }
  .voice-result-item .vri-text strong { font-weight: 700; }
  .voice-result-item .vri-text span { color: var(--text-secondary); font-size: 12px; display:block; margin-top: 2px; }
  .voice-result-item .vri-check { flex:0 0 auto; color: var(--module-1); font-size: 18px; }
  .voice-actions { display: flex; gap: 10px; }
  .voice-actions .btn { flex: 1; }
  .voice-manual { margin-top: 12px; }
  .voice-manual textarea { width: 100%; box-sizing: border-box; }
  .voice-hint { text-align: center; font-size: 12px; color: var(--text-tertiary); margin-top: 14px; }
  .voice-mic-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0; }
  .voice-mic-btn button { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: var(--on-accent); display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-overlay); transition: transform .15s; }
  .voice-mic-btn button:active { transform: scale(.9); }
  .voice-mic-btn button.recording { background: var(--danger); }
  .voice-mic-btn .vmb-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
</style>

<body>
<div class="app">
  <div class="topbar">
    <button class="menu-btn" id="btn-menu"></button>
    <div class="title" id="topTitle">我的工作台<small id="topSub">Personal Workbench</small></div>

</div>
<button class="voice-fab" id="voiceFab" onclick="openVoicePanel()" title="语音智能打卡"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>

<!-- bottom nav -->
<div class="nav" id="nav">

  <div class="n" data-nav="drawer"></div>
  <div class="n" data-nav="insight"></div>
</div>

<!-- drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">

    <input type="file" id="avatarInput" accept="image/*" hidden/>

<script>
/* ============================================================
   CONFIG — 唯一需要定制的地方。
   modules 里每个模块 = 一个功能页；type 决定它长什么样、记什么字段。
   支持的 type：
     todo     今日计划/待办（勾选 + 优先级）
     checkin  习惯打卡（连续天数，每天清零）
     progress 长期计划（进度条：当前/目标）
     finance  记账（收入/支出 + 分类 + 金额）
     note     内容记录/日记（标题 + 正文 + 心情标签）
   图标用 icon 字段（取自下方 ICONS 图标库，全部为单色线性图标）。
   ============================================================ */
const CONFIG = {
  storageKey: "health-tracker-v2",     // 换 key 可强制重置

  // 每日一句（随机选取，基于昨日打卡完成率分池）
  quotes: {
    high: [  // 昨日完成率 ≥75%
      "函哥昨天的打卡简直是教科书级别——今天的你也配得上一杯无糖豆浆庆祝！",
      "函哥昨天那么自律，今天体重秤都得对你客气三分。",
      "打卡全勤的函哥，连食堂阿姨都拦不住你的脚步——当然是指快走的脚步。",
      "函哥昨天的表现说明：你不是在减肥，你是在重新定义自己。继续保持！",
      "自律的函哥最帅——看看首页那张照片，那就是你的目标。",
      "函哥昨天完成率这么高，今天可以理直气壮地对宵夜说：你不配。",
      "能管住嘴迈开腿的函哥，将来管什么都成。昨天证明了这一点。",
      "函哥昨天打卡像开了挂，今天继续保持，别人以为你吃了什么特效药。",
    ],
    mid: [  // 昨日完成率 25%-74%
      "函哥昨天打卡了一半？没关系，今天补回来，身体不会跟你算旧账的。",
      "进步不需要完美，函哥昨天做了一些，今天多做一点，累积起来就是变化。",
      "函哥昨天没全打完？正常，人生又不是自动售货机投币就出货。今天继续。",
      "半完成也是一种完成——函哥至少开始了。今天再多勾一个就算赢。",
      "昨天的函哥已经比上周进步了，今天的函哥要不要再往前走一步？",
      "函哥打卡像追剧，昨天看了两集今天看三集，大结局总会来的。",
    ],
    low: [  // 昨日完成率 <25% 或无记录
      "函哥昨天放了个假？没问题，今天重新开机，身体这个系统支持随时重启。",
      "昨天的事昨天翻篇，函哥今天的打卡从现在开始——哪怕只勾一个也行。",
      "跌倒了爬起来就好，又不是跑步比赛——哦等等，函哥确实在快走。那就走起来！",
      "函哥昨天没打卡不代表失败，代表今天有一个完美的反弹机会。",
      "每个人都会有摆烂日，但今天不是。函哥打开打卡页，先勾一个试试？",
      "昨天的空白页今天来填——函哥哪怕只写一笔，也比空着好看。",
      "没关系，C罗也有休息日。但今天是函哥的训练日，先动起来吧！",
    ],
    generic: [  // 通用（无昨日数据时使用）

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const valid=series.filter(v=>v>0);
  const max=valid.length?Math.max(...valid):0, min=valid.length?Math.min(...valid):0;
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=v>0?padTop+innerH*(1-(v-min)/rng):padTop+innerH;
    return {x,y,v};
  });
  let lineCmd="", prevValid=false;
  pts.forEach((p,i)=>{
    if(p.v>0){ lineCmd+=(prevValid?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)+' '; prevValid=true; }
    else prevValid=false;
  });
  const lastValid=[...pts].reverse().find(p=>p.v>0);
  const firstValid=pts.find(p=>p.v>0);
  const area=firstValid&&lastValid?lineCmd+` L ${lastValid.x.toFixed(1)} ${h-padBot} L ${firstValid.x.toFixed(1)} ${h-padBot} Z`:"";
  const dots=pts.filter(p=>p.v>0).map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    ${area?`<path d="${area}" fill="url(#tg)"/>`:''}<path d="${lineCmd}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- weight history chart (full) ---------- */
function weightChartHTML(entries){
  const wData = entries.filter(x=>x.weightVal).sort((a,b)=>a.date.localeCompare(b.date));
  if(!wData.length) return `<div class="wc-empty">${icon("target",22)}<span>暂无体重数据，记一笔后自动生成曲线</span></div>`;

  const vals = wData.map(x=>+x.weightVal);
  const dates = wData.map(x=>x.date);
  const max = Math.max(...vals), min = Math.min(...vals);
  const rng = (max-min)||1;
  const padTop = padBot = Math.max(8, rng*0.15);
  const padL = 36, padR = 12, padX = 14;
  const cw = 320, ch = 150;
  const innerW = cw - padL - padR, innerH = ch - padTop - padBot;

  const pts = vals.map((v,i)=>{
    const x = padL + (wData.length===1 ? innerW/2 : innerW*i/(wData.length-1));
    const y = padTop + innerH*(1-(v-min)/rng);
    return {x,y,v,date:dates[i]};
  });

  const line = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const lastP = pts[pts.length-1], firstP = pts[0];
  const area = line + ` L ${lastP.x.toFixed(1)} ${(padTop+innerH).toFixed(1)} L ${firstP.x.toFixed(1)} ${(padTop+innerH).toFixed(1)} Z`;

  const yMin = (min - rng*0.1).toFixed(1), yMax = (max + rng*0.1).toFixed(1);
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');

  const fmtDate = ds => { const d=new Date(ds); return `${d.getMonth()+1}/${d.getDate()}`; };
  const xLabels = wData.length<=1 ? [fmtDate(dates[0])] :
    wData.length<=4 ? dates.map(fmtDate) :
    [fmtDate(dates[0]), fmtDate(dates[Math.floor(dates.length/3)]), fmtDate(dates[Math.floor(dates.length*2/3)]), fmtDate(dates[dates.length-1])];
  const xPositions = wData.length<=1 ? ['0%'] :
    wData.length<=4 ? dates.map((_,i)=>`${i/(dates.length-1)*100}%`) :
    ['0%','33%','67%','100%'];

  const delta = (vals[vals.length-1]-vals[0]);
  const deltaStr = delta>0?`+${delta.toFixed(1)}`:delta.toFixed(1);
  const deltaColor = delta>0?'var(--danger)':delta<0?'var(--module-1)':'var(--text-secondary)';

  return `<div class="wc-head">${icon("chart",15)} 体重变化曲线<span class="wc-delta" style="color:${deltaColor}">累计 ${deltaStr} kg</span></div>
    <svg class="wc-svg" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="wcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
      <text x="6" y="${(padTop+4).toFixed(1)}" font-size="10" fill="var(--text-tertiary)">${yMax}</text>
      <text x="6" y="${(ch-padBot).toFixed(1)}" font-size="10" fill="var(--text-tertiary)">${yMin}</text>
      <line x1="${padL}" y1="${padTop}" x2="${cw-padR}" y2="${padTop}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="${padL}" y1="${ch-padBot}" x2="${cw-padR}" y2="${ch-padBot}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${area}" fill="url(#wcg)"/>
      <path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      <text x="${lastP.x.toFixed(1)}" y="${(lastP.y-10).toFixed(1)}" font-size="11" font-weight="700" fill="var(--module-2)" text-anchor="middle">${vals[vals.length-1]}kg</text>
    </svg>
    <div class="wc-x">${xPositions.map((p,i)=>`<span style="text-align:left">${xLabels[i]||''}</span>`).join('')}</div>
    <div class="wc-stats">
      <div class="wc-stat"><div class="l">起始</div><div class="v" style="color:var(--text-secondary)">${vals[0]}</div></div>
      <div class="wc-stat"><div class="l">最低</div><div class="v" style="color:var(--module-1)">${min}</div></div>
      <div class="wc-stat"><div class="l">最高</div><div class="v" style="color:var(--danger)">${max}</div></div>
      <div class="wc-stat"><div class="l">最新</div><div class="v" style="color:var(--module-2)">${vals[vals.length-1]}</div></div>
    </div>`;
}

function pickFoods(){
  const today = new Date();
  const dayIndex = Math.floor(today.getTime()/(1000*60*60*24));
  function rotate(arr, offset){ return arr[(dayIndex+offset) % arr.length]; }
  function rotateN(arr, offset, n){
    const out=[]; for(let i=0;i<n;i++) out.push(arr[(dayIndex+offset+i) % arr.length]); return out; }
  return {
    bCarb: rotate(FOOD_POOL.breakfastCarb, 0),
    bProtein: rotateN(FOOD_POOL.breakfastProtein, 3, 2),
    lCarb: rotate(FOOD_POOL.lunchCarb, 1),
    lMeat: rotate(FOOD_POOL.lunchMeat, 2),
    lVeg: rotateN(FOOD_POOL.lunchVeg, 4, 2),
    dCarb: rotate(FOOD_POOL.dinnerCarb, 5),
    dProtein: rotate(FOOD_POOL.dinnerProtein, 6),
    dVeg: rotate(FOOD_POOL.dinnerVeg, 7),
    snack: rotate(FOOD_POOL.snack, 8),
  };
}

function parseVoiceInput(text){
  const results = [];
  const t = today();
  const checked = new Set();
  function tryCheck(moduleKey, itemId, label, reason){
    const key = moduleKey+":"+itemId;
    if(checked.has(key)) return;
    const items = data[moduleKey]||[];
    const item = items.find(x=>x.id===itemId);
    if(!item) return;
    item.log = item.log||{};
    if(!item.log[t]){
      item.log[t] = true;
      checked.add(key);
      results.push({ moduleKey, itemId, label, reason });
    }
  }

  const lower = text.toLowerCase();

  // Diet rules
  VOICE_RULES.diet.forEach(rule=>{
    const hasMeal = rule.match.some(m=>text.includes(m));
    if(rule.any){
      if(rule.match.some(m=>text.includes(m))){
        tryCheck("diet", rule.itemId, rule.label, "提到"+rule.match[0]);
      }
      return;
    }
    if(!hasMeal) return;
    // Check for "没吃" / "不吃" skip
    const segment = text.substring(text.indexOf(rule.match[0]));
    if(segment.includes("没吃")||segment.includes("不吃")||segment.includes("没喝")||segment.includes("没喝")) return;
    if(rule.keywords){
      const found = rule.keywords.filter(k=>text.includes(k));
      if(found.length>0){
        tryCheck("diet", rule.itemId, rule.label, rule.match[0]+"提到"+found.join("、"));
      }
    } else {
      tryCheck("diet", rule.itemId, rule.label, rule.match[0]);
    }
  });

  // Exercise rules
  VOICE_RULES.exercise.forEach(rule=>{
    const matched = rule.match.some(m=>text.includes(m));
    if(!matched) return;
    if(rule.keywords){
      const found = rule.keywords.filter(k=>text.includes(k));
      if(found.length>0 || rule.match.some(m=>["打球","篮球","足球","羽毛球","乒乓球","网球","游泳"].includes(m))){
        tryCheck("exercise", rule.itemId, rule.label, "运动: "+rule.match.find(m=>text.includes(m)));
      }
    } else {
      tryCheck("exercise", rule.itemId, rule.label, rule.match.find(m=>text.includes(m)));
    }
  });

  // Exercise log: extract type + duration from voice
  const exTypes = ["篮球","足球","羽毛球","乒乓球","网球","游泳","快走","慢跑","跑步","拉伸","静蹲","靠墙","力量","俯卧撑","引体","哑铃","器械","骑自行车","跳绳","打球","散步","爬山","爬楼梯"];
  const matchedTypes = exTypes.filter(t=>text.includes(t));
  let matchedDur = 0;
  const durPatterns = [
    {re:/(\d+)\s*分钟/g, mul:1},
    {re:/(\d+)\s*半小时/g, mul:30},
    {re:/半小时/g, mul:30},
    {re:/(\d+)\s*小时/g, mul:60},
    {re:/一小时/g, mul:60},
  ];
  for(const p of durPatterns){
    const m = p.re.exec(text);
    if(m){ matchedDur = p.mul===1 ? +m[1] : p.mul; break; }
  }
  if(matchedTypes.length > 0 && matchedDur > 0){
    const t = today();
    const exlog = data.__exlog || {};
    exlog[t] = (exlog[t]||[]).filter(x=>x.type!=="rest");
    exlog[t].push({ type:matchedTypes[0], duration:matchedDur, time:Date.now() });
    data.__exlog = exlog;
    results.push({ moduleKey:"__exlog", itemId:0, label:`运动日志: ${matchedTypes[0]} ${matchedDur}分钟`, reason:"语音识别运动记录" });
  }

  // Sleep rules
  VOICE_RULES.sleep.forEach(rule=>{
    const matched = rule.match.some(m=>text.includes(m));
    if(matched){
      tryCheck("sleep", rule.itemId, rule.label, rule.match.find(m=>text.includes(m)));
    }
  });

  // Negative: no sweet drinks
  if(text.includes("没喝") && (text.includes("饮料")||text.includes("奶茶")||text.includes("可乐")||text.includes("果汁"))){
    tryCheck("diet", 29, "没喝含糖饮料", "提到没喝含糖饮料");
  }
  if(text.includes("没吃宵夜")||text.includes("没吃夜宵")){
    tryCheck("diet", 30, "没吃宵夜", "提到没吃宵夜");
  }

  return results;
}

  const $transcript = overlay.querySelector("#vTranscript");

  const $confirm = overlay.querySelector("#vConfirm");
  const $micBtn = overlay.querySelector("#vMicBtn");
  const $micLabel = overlay.querySelector("#vMicLabel");
  const $manual = overlay.querySelector("#vManual");

  const close = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#vCancel").onclick = close;

  let finalText = "";

  function runAnalysis(text){
    finalText = text;
    $transcript.textContent = text;
    $transcript.classList.remove("empty");
    const results = parseVoiceInput(text);
    if(results.length===0){
      $results.innerHTML = `<div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:10px">未匹配到打卡项，可以手动输入试试</div>`;
      $confirm.disabled = true;
      $confirm.style.opacity = ".5";
    } else {
      $results.innerHTML = results.map(r=>{
        const m = modOf(r.moduleKey);
        return `<div class="voice-result-item">
          <div class="vri-icon" style="background:${m.tint};color:${m.color}">${icon(m.icon,14)}</div>
          <div class="vri-text"><strong>${esc(r.label)}</strong><span>${esc(r.reason)} · ${m.name}</span></div>
          <div class="vri-check">${icon("check",18,2.4)}</div>
        </div>`;
      }).join("");
      $confirm.disabled = false;
      $confirm.style.opacity = "1";
    }
  }

  $manual.oninput = ()=>{
    const v = $manual.value.trim();
    if(v) runAnalysis(v);
    else { $transcript.textContent = "识别到的内容会显示在这里…"; $transcript.classList.add("empty"); $results.innerHTML=""; $confirm.disabled=true; $confirm.style.opacity=".5"; }
  };

  if(hasSR){
    $micBtn.onclick = ()=>{
      if(voiceActive) return;
      voiceActive = true;
      $micBtn.classList.add("recording");
      $micLabel.textContent = "正在聆听…再说一次点击结束";
      const rec = new SR();
      voiceRecognition = rec;
      rec.lang = "zh-CN";
      rec.continuous = false;
      rec.interimResults = true;
      let interim = "";
      rec.onresult = e=>{
        for(let i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        $transcript.textContent = finalText + interim;
        $transcript.classList.remove("empty");
      };
      rec.onend = ()=>{
        voiceActive = false;
        $micBtn.classList.remove("recording");
        $micLabel.textContent = "点击重新说";
        const combined = (finalText + ( $manual.value.trim()||"")).trim();
        if(combined) runAnalysis(combined);
      };
      rec.onerror = ()=>{
        voiceActive = false;
        $micBtn.classList.remove("recording");
        $micLabel.textContent = "识别失败，可手动输入";
      };
      try { rec.start(); } catch(e){ voiceActive=false; $micBtn.classList.remove("recording"); }
    };
  }

  $confirm.onclick = ()=>{
    persist();
    close();
    const n = $results.children.length;
    showToast(n>0?`函哥，已打卡 ${n} 项，太棒了！`:"已保存");
    if(currentView) renderView();
  };
}

/* ---------- data export / import ---------- */
function exportData(){
  const backup = { version:1, date:new Date().toISOString(), data:data };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "健康打卡备份_" + today() + ".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("备份已下载到手机");
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try {
      const backup = JSON.parse(ev.target.result);
      if(backup.data && typeof backup.data === "object"){
        Object.assign(data, backup.data);
        persist();
        showToast("数据恢复成功！");
      } else { showToast("文件格式不对"); }
    } catch(e){ showToast("文件损坏，无法读取"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* ---------- calendar grid (打卡月视图) ---------- */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    // 今天之前的日期取消打卡：高风险（会断连续），先确认
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

function generateSmartPlanHTML(data, wData){
  const now = new Date();
  const days7 = [];
  for(let i=6; i>=0; i--){ const d=new Date(now); d.setDate(now.getDate()-i); days7.push(d.toISOString().slice(0,10)); }

  function checkinStats(key){
    const items = data[key] || [];
    if(!items.length) return { total:0, done:0, pct:0, items:[] };
    let totalDone = 0, totalPossible = 0;
    const itemStats = items.map(it=>{
      let done = 0;
      days7.forEach(d=>{ if(it.log && it.log[d]) done++; });
      totalDone += done;
      totalPossible += 7;
      return { title: it.title, done, pct: Math.round(done/7*100), id: it.id };
    });
    return { total: totalPossible, done: totalDone, pct: totalPossible? Math.round(totalDone/totalPossible*100):0, items: itemStats };

  const exStats = checkinStats("exercise");

function renderInsight(){
  const DONUT_COLORS=["var(--module-4)","var(--module-3)","var(--module-5)","var(--module-2)","var(--module-1)","var(--danger)","var(--text-tertiary)"];
  const bars = CONFIG.modules.map(m=>{
    const it=data[m.key]||[]; let pct=0, label="";
    if(m.type==="todo"){ const d=it.filter(x=>x.done).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="checkin"){ const t=today(); const d=it.filter(x=>x.log&&x.log[t]).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; label=`${pct}%`; }
    else if(m.type==="finance"){ const e=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0); label=`¥${e}`; }
    else { label=`${it.length} 条`; }
    return {m, pct, label};
  });
  const barAvg = bars.length ? Math.round(bars.reduce((s,b)=>s+b.pct,0)/bars.length) : 0;
  const barList = bars.map(b=>`<div class="bar-row" data-open="${b.m.key}" role="button" tabindex="0">
    <span class="bar-ic" style="color:${b.m.color}">${icon(b.m.icon,17)}</span>
    <span class="bar-name">${b.m.name}</span>
    <div class="pbar"><i style="width:${Math.min(100,b.pct)}%;background:${b.m.color}"></i></div>
    <span class="bar-pct">${b.label}</span></div>`).join("");

  // 体重趋势
  const series = CONFIG.trend.series(data);
  const hasTrend = series.length>0;
  const avg = hasTrend ? Math.round(series.reduce((a,b)=>a+b,0)/series.filter(v=>v>0).length*10)/10 : 0;
  const trend = hasTrend ? trendSVG(series)
    : `<div class="trend-empty">${icon("chart",22)}<span>暂无体重数据，先去「体重记录」记一笔吧</span></div>`;
  const wData = (data.weight||[]).filter(x=>x.weightVal).sort((a,b)=>a.date.localeCompare(b.date));
  const latestW = wData.length ? wData[wData.length-1] : null;
  const firstW = wData.length ? wData[0] : null;
  const wDelta = (latestW && firstW && wData.length>1) ? (Math.round((+latestW.weightVal - +firstW.weightVal)*10)/10) : 0;
  const wArrow = wDelta>0?"↑ +"+wDelta:wDelta<0?"↓ "+wDelta:"→ 持平";
  const wColor = wDelta>0?"var(--danger)":wDelta<0?"var(--module-1)":"var(--text-secondary)";

  $("#screen").innerHTML = `<div class="greet"><div><h1>函哥的打卡建议</h1><p>基于近期打卡数据 · 明天怎么吃怎么动这里看</p></div></div>
    <div class="sec-title">模块完成度</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 模块完成度<span class="avg">均 ${barAvg}%</span></div>
      <div class="bar-list">${barList}</div></div>
    <div class="sec-title">体重趋势</div>
    <div class="panel trend-panel"><div class="ph">${icon("target",15)} ${CONFIG.trend.title}${hasTrend?`<span class="avg">${latestW?`最新 ${latestW.weightVal}kg`:`均 ${avg}${CONFIG.trend.unit}`}</span>`:''}</div>
      ${trend}${hasTrend?`<div class="trend-x"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>`:''}
      ${wData.length>1?`<div class="cal-foot" style="margin-top:10px">${icon("activity",13)} 累计变化 <span style="color:${wColor};font-weight:700">${wArrow} kg</span> · 共 ${wData.length} 条记录</div>`:''}</div>
    ${generateSmartPlanHTML(data, wData)}
  `;
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}

/* ---------- exercise log ---------- */
function renderExerciseLog(){
  const t = today();
  const log = data.__exlog || {};
  const todayLog = (log[t] || []).filter(x=>x.type !== "rest");
  const restEntry = (log[t] || []).find(x=>x.type === "rest");
  const totalMin = todayLog.reduce((s,x)=>s+(+x.duration||0),0);

  let statsHTML = "";
  if(todayLog.length > 0 || restEntry){
    statsHTML = `<div class="exlog-stats"><div class="es"><div class="es-v">${todayLog.length}</div><div class="es-l">今日运动</div></div>
      <div class="es"><div class="es-v">${totalMin}</div><div class="es-l">总时长(分钟)</div></div>
      <div class="es"><div class="es-v">${restEntry?"休息":"运动"}</div><div class="es-l">今日状态</div></div></div>`;
  }

  let entriesHTML = "";
  if(restEntry){
    entriesHTML = `<div class="exlog-rest"><div class="el-icon">${icon("moon",16)}</div>
      <div class="el-info"><div class="el-type">今日休息日</div><div class="el-meta">${restEntry.note||"好好恢复"}</div></div>
      <button class="el-del" data-exlog-del="rest">${icon("trash",14)}</button></div>`;
  } else {
    entriesHTML = todayLog.map((e,i)=>{
      const tm = e.time ? new Date(e.time).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}) : "";
      return `<div class="exlog-entry"><div class="el-icon">${icon("activity",16)}</div>
        <div class="el-info"><div class="el-type">${esc(e.type)}</div>
        <div class="el-meta">${e.duration||0}分钟${e.intensity?" · "+e.intensity:""}${tm?" · "+tm:""}${e.note?" · "+e.note:""}</div></div>
        <button class="el-del" data-exlog-del="${i}">${icon("trash",14)}</button></div>`;
    }).join("");
  }

  const emptyHTML = (!todayLog.length && !restEntry) ? `<div class="exlog-empty">还没有今日运动记录，在下方添加</div>` : "";

  const addBarHTML = restEntry ? "" : `<div class="exlog-add-bar">
    <input id="exlog-type" placeholder="运动类型（如：篮球）" autocomplete="off" list="exlog-types">
    <input id="exlog-dur" type="number" placeholder="时长" style="flex:0 0 70px" min="0">
    <button id="exlog-add" style="background:var(--module-3);color:#fff">添加</button>
  </div>
  <datalist id="exlog-types">
    <option value="篮球"><option value="足球"><option value="羽毛球"><option value="乒乓球">
    <option value="游泳"><option value="快走"><option value="慢跑"><option value="拉伸">
    <option value="靠墙静蹲"><option value="力量训练"><option value="骑自行车"><option value="跳绳">
  </datalist>`;

  const restBtnHTML = restEntry ? "" : `<button class="exlog-rest-btn" id="exlog-rest">今日休息日（生病/受伤/没时间）</button>`;

  return `<div class="panel exlog-panel">
    <div class="ph">${icon("activity",15)} 今日运动日志 <span class="more">灵活记录</span></div>
    ${statsHTML}${entriesHTML}${emptyHTML}${addBarHTML}${restBtnHTML}
  </div>`;
}

function wireExerciseLog(){
  const t = today();
  const log = data.__exlog || {};
  log[t] = log[t] || [];

  const addBtn = $("#exlog-add");
  if(addBtn){
    addBtn.onclick = ()=>{
      const typeEl = $("#exlog-type");
      const durEl = $("#exlog-dur");
      const type = (typeEl.value||"").trim();
      const dur = +(durEl.value||0);
      if(!type){ showToast("请输入运动类型"); return; }
      if(!dur || dur<=0){ showToast("请输入时长（分钟）"); return; }
      log[t].push({ type, duration:dur, time:Date.now() });
      data.__exlog = log;
      persist();
      typeEl.value=""; durEl.value="";
      showToast(`函哥，已记录${type} ${dur}分钟`);
      render(view);
    };
  }

  const restBtn = $("#exlog-rest");
  if(restBtn){
    restBtn.onclick = ()=>{
      log[t] = [{ type:"rest", note:"今日休息", time:Date.now() }];
      data.__exlog = log;
      persist();
      showToast("已标记今日为休息日，好好恢复");
      render(view);
    };
  }

  document.querySelectorAll("[data-exlog-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.dataset.exlogDel;
      if(idx === "rest"){
        log[t] = log[t].filter(x=>x.type !== "rest");
      } else {
        log[t].splice(+idx, 1);
      }
      data.__exlog = log;
      persist();
      render(view);
    };
  });
}

function renderModule(key){
  const m=modOf(key); const it=data[key]||[];
  const t=today();
  let head="", extra="";
  if(m.type==="finance"){
    const inc=it.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
    const exp=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=it.filter(x=>x.done).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it);
    head=headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else if(m.type==="note"){
    if(key==="weight"){
      const wData=it.filter(x=>x.weightVal).sort((a,b)=>a.date.localeCompare(b.date));
      const latest=wData.length?wData[wData.length-1]:null;
      const todayN=it.filter(x=>x.date===t&&x.weightVal).length;
      head=latest?headHero(m,`${latest.weightVal}kg`,`${wData.length} 条记录 · 今日${todayN?"已":"未"}记录`,null):headHero(m,"—","暂无记录",null);
    } else {
      const todayN=it.filter(x=>x.date===t).length;
      head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
    }
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  if(key==="weight") extra=`<div class="panel wc-panel">${weightChartHTML(it)}</div>`;
  if(key==="exercise") extra=renderExerciseLog();
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:16px">${head}${extra}
      <div class="sec-title">记录</div>${body}</div>`;
  wireModule(key);
  if(key==="exercise") wireExerciseLog();
}

/* per-module hero header: compact strip — icon + big number + label + optional progress bar */
function headHero(m, big, label, pct){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div class="hero-tx"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div>
    ${pct!=null?`<div class="hero-bar"><i style="width:${Math.min(100,pct)}%;background:${m.color}"></i></div>`:''}</div>`;
  if(m.cover) return `<div class="hero has-cover"><div class="hero-bg" style="background-image:url('${attr(m.cover)}')"></div><div class="hero-inner">${inner}</div></div>`;
  return `<div class="hero">${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout (原有逻辑)
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${x.amount}</div></div></div>`;
  }
  // guide module: collapsible cards
  if(m.key==="guide"){
    return `<div class="rec collapsible" data-id="${x.id}">${acts}
      <div class="col-header" data-toggle="${x.id}">
        ${x.mood?`<span class="col-badge">${esc(x.mood)}</span>`:''}
        <span class="col-title">${esc(x.title||'无标题')}</span>
        <span class="col-chev">${icon("chevron",16,2)}</span>
      </div>
      <div class="col-body"><div class="col-body-inner">
        ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}
        ${customBlock}
      </div></div>
    </div>`;
  }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  $("#screen").querySelectorAll("[data-toggle]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); el.closest(".collapsible").classList.toggle("expanded"); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key, item){
  const m=modOf(key); const editing=!!item;
  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项名称</label><input id="f-title" value="${attr(d.title)}" placeholder="输入打卡项名称，如：打篮球" autocomplete="off"/></div>
      <p class="sub" style="margin:0;font-size:11px;color:var(--text-tertiary)">保存后自动按统一样式显示，点击左侧方块即可打卡</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  // layout variant selector — only for non-checkin types (checkin uses standard list)
  const isCheckin = m.type==="checkin";
  if(!isCheckin){
    const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
    fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;
  }

  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // image URL field — only for non-checkin types
  if(!isCheckin){
    fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;
  }

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / nav ---------- */
function go(v){ view=v; closeDrawer(); render(); window.scrollTo({top:0}); }
function render(){
  // top title
  if(view==="home"){ $("#topTitle").firstChild.textContent="健康管理台"; $("#topSub").textContent=CONFIG.slogan; }
  else if(view==="insight"){ $("#topTitle").firstChild.textContent="打卡建议"; $("#topSub").textContent="明天怎么吃怎么动"; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:"健康管理台"; $("#topSub").textContent=m?m.desc:""; }
  // nav active
  $("#nav").querySelector('[data-nav="home"]').classList.toggle("active", view==="home");
  $("#nav").querySelector('[data-nav="insight"]').classList.toggle("active", view==="insight");
  // render body
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else renderModule(view);
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent=CONFIG.owner + " · 函哥专属";
  $("#drawerSlogan").textContent=CONFIG.slogan;
  const items=[`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`))
    .concat([`<div class="ditem" data-go="insight">${icon("chart",20)}打卡建议</div>`]);
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go(t);
});

/* ---------- avatar upload ---------- */
$("#brandCam").innerHTML = icon("camera",18);
if(data.__avatar) $("#brandImg").src = data.__avatar;
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#brandImg").src = reader.result; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- photo rotation ---------- */
function getTodaysPhoto(){
  const photos = data.__photos || [];
  if(photos.length === 0) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const dayOfYear = Math.floor(diff / oneDay);
  const idx = dayOfYear % photos.length;
  return { src: photos[idx], index: idx, total: photos.length };
}

function applyTodaysPhoto(){
  const photo = getTodaysPhoto();
  if(photo){
    document.documentElement.style.setProperty('--greet-image', `url("${photo.src}")`);
  }
}

function renderPhotoGrid(){
  const photos = data.__photos || [];
  const today = getTodaysPhoto();
  const grid = $("#photoGrid");
  let html = "";
  photos.forEach((p,i)=>{
    const isToday = today && today.index === i;
    html += `<div class="pm-item ${isToday?'active':''}">
      <img src="${p}" alt="照片${i+1}">
      <button class="pm-del" data-photo-del="${i}">✕</button>
      <span class="pm-index">${isToday?'今日':'第'+(i+1)+'张'}</span>
    </div>`;
  });
  html += `<div class="pm-add" id="photoAddBtn">
    <span style="font-size:24px">+</span>
    <span>添加照片</span>
  </div>`;
  grid.innerHTML = html;

  grid.querySelectorAll("[data-photo-del]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const idx = +btn.dataset.photoDel;
      if(photos.length <= 1){
        showToast("至少保留一张照片哦");
        return;
      }
      photos.splice(idx, 1);
      data.__photos = photos;
      persist();
      renderPhotoGrid();
      applyTodaysPhoto();
      if(view==="home") render();
    };
  });

  $("#photoAddBtn").onclick = () => $("#photoInput").click();
}

$("#photoManageBtn").onclick = ()=>{
  closeDrawer();
  renderPhotoGrid();
  $("#photoModal").classList.remove("hidden");
};
$("#photoModalClose").onclick = ()=> $("#photoModal").classList.add("hidden");
$("#photoModal").onclick = (e)=>{
  if(e.target.id === "photoModal") $("#photoModal").classList.add("hidden");
};
$("#photoInput").onchange = e => {
  const files = e.target.files;
  if(!files || !files.length) return;
  const photos = data.__photos || [];
  let loaded = 0;
  const total = files.length;
  for(let i=0; i<total; i++){
    const reader = new FileReader();
    reader.onload = () => {
      photos.push(reader.result);
      loaded++;
      if(loaded === total){
        data.__photos = photos;
        persist();
        renderPhotoGrid();
        applyTodaysPhoto();
        if(view==="home") render();
        showToast(`函哥，已添加 ${total} 张照片`);
      }
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = "";
};

// Initialize photo on load
applyTodaysPhoto();

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

buildDrawer();
render();
</script>

<!-- photo management modal -->
<div class="photo-modal hidden" id="photoModal">
  <div class="pm-sheet">
    <div class="pm-head">
      <h3>首页照片管理</h3>
      <button class="pm-close" id="photoModalClose">✕</button>
    </div>
    <div class="pm-grid" id="photoGrid"></div>
    <div class="pm-hint">每天自动轮换一张 · 同一天显示同一张<br>上传越多，每天看到的惊喜越多 🎁</div>
  </div>
</div>

</body>
</html>
